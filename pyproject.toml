[project]
name = "conrrad-citizen"
version = "0.2.7"
description = "Citizen — Authentic Digital Organism"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
citizen = "citizen_seed.__main__:main"
citizen-seed = "citizen_seed.__main__:main"

[tool.setuptools.package-dir]
"" = "runtime"

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["citizen_seed*"]

[tool.setuptools.package-data]
citizen_seed = [
    "_genesis/**/*",
    "ui/**/*",
    "_genesis/*/meta.json",
    "_genesis/*/payload",
    "_genesis/publisher.secret.example",
]
