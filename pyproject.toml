[project]
name = "citizen-seed"
version = "0.2.0"
description = "Citizen 0.2 source line — Asset-First minimal Runtime"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
citizen-seed = "citizen_seed.__main__:main"

[tool.setuptools.package-dir]
"" = "runtime"

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["citizen_seed*"]
