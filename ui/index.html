<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Citizen Birth Observatory</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <header id="header">
      <img id="logo" src="/logo.png" alt="CONRRAD" width="64" height="64" />
      <div>
        <h1 class="brand">CITIZEN BIRTH OBSERVATORY</h1>
        <span id="version-badge" class="badge">—</span>
      </div>
    </header>

    <section id="identity">
      <h2>IDENTITY</h2>
      <dl>
        <dt>Citizen ID</dt>
        <dd id="citizen-id">—</dd>
        <dt>Age</dt>
        <dd id="age">—</dd>
        <dt>Runtime Version</dt>
        <dd id="runtime-version">—</dd>
        <dt>Manifest Version</dt>
        <dd id="manifest-version">—</dd>
      </dl>
      <button id="export-btn" type="button">Export Birth Package</button>
    </section>

    <section id="sync">
      <h2>SYNC</h2>
      <button id="sync-btn" type="button" class="green" disabled>Current</button>
    </section>

    <section id="journal">
      <h2>CITIZEN LIFE JOURNAL</h2>
      <div id="timeline" class="timeline"></div>
      <pre id="bio"></pre>
      <div id="node-detail" class="node-detail hidden"></div>
    </section>

    <section id="terminal">
      <h2>TERMINAL</h2>
      <pre id="term"></pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
